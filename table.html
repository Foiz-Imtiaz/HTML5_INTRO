<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table </title>
    <style>
        table{
            border-collapse: collapse;
        }
        td,th{
            border: 1px solid black;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <main>
        <h2>Friends</h2>
        <table>
            <caption>My Laura Friends</caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>First Name</th>
                    <th>Department</th>
                    <th>Batch</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Imtiaz</td>
                    <td> CSE</td>
                    <td> 251</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Labonno</td>
                    <td> CSE</td>
                    <td> 252</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Labiba</td>
                    <td> English</td>
                    <td> 252 </td>
                </tr>
                
            </tbody>
            <tfoot>
                <td colspan="2">Total Friend: 3</td>
            </tfoot>
        </table>
    </main>
    <section>
        <h2>Table Info</h2>
        <ul>
            <li>Table: table</li>
            <li>Table head: thead</li>
            <li>Table body: tbody</li>
            <li>Table Foot: tfoot </li>
            <li>Table row: tr</li>
            <li>Table data: td </li>
            <li>Table Head: th</li>
        </ul>
    </section>
</body>
</html>
