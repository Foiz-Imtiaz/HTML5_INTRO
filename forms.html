                </fieldset>
                <fieldset>
                    <legend>Bhorta Selection </legend>
                    <input type="checkbox" name="" id="alu">
                    <label for="alu">Alu Bhorta</label>
                    <input type="checkbox" name="bhorta" id="sorisha">
                    <label for="sorisha">Sorisha Vhorta</label>
                    <input type="checkbox" name="bhorta" id="sutki">
                    <label for="sutki">Shutki Bhorta</label>
                    <input type="checkbox" name="bhorta" id="morich">
                <label for="morich">Morich Bhorta </label>
                </fieldset>
                <fieldset>
                    <legend>Extra info</legend>
                    <textarea cols="50" rows="5" name="" id=""></textarea>
                </fieldset>

                <input type="reset" value="clear">
